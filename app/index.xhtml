<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>订阅规则助手</title>
<style>
  :root{
    --bg:#0b0e14; --bg2:#11151f; --card:#161b26; --card2:#1b2130;
    --line:#262d3d; --text:#e6e9f0; --muted:#8b93a7; --dim:#5c6478;
    --acc:#4f7cff; --acc2:#7aa2ff; --ok:#34c98e; --err:#ff6b6b; --warn:#ffb454;
    --radius:14px; --maxw:880px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(79,124,255,.12), transparent 60%),
      radial-gradient(900px 400px at -10% 110%, rgba(52,201,142,.07), transparent 60%),
      var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;flex-direction:column;height:100dvh;max-width:var(--maxw);margin:0 auto;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  header{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line);flex:none}
  .logo{width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--acc),#8f6bff);display:grid;place-items:center;font-size:17px}
  header .ttl{font-weight:700;font-size:15px;line-height:1.2}
  header .sub{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
  .spacer{flex:1}
  .chip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 9px;background:var(--card);max-width:26vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;cursor:pointer;flex:none}
  .icon-btn:hover{background:var(--card2)}

  main{flex:1;overflow-y:auto;padding:18px 16px 10px;scroll-behavior:smooth}
  .col{display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}
  .msg{display:flex;gap:10px;align-items:flex-start}
  .msg .ava{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:14px;margin-top:2px}
  .msg.user{flex-direction:row-reverse}
  .msg.user .ava{background:linear-gradient(135deg,#2b3550,#38466b)}
  .msg.ai .ava{background:linear-gradient(135deg,var(--acc),#8f6bff)}
  .bubble{max-width:82%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.65;overflow-wrap:anywhere}
  .msg.user .bubble{background:linear-gradient(135deg,#31528f,#3d63a8);border-bottom-right-radius:4px}
  .msg.ai .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
  .bubble pre{background:#0d1117;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;overflow-x:auto;font-size:12px;line-height:1.55;font-family:ui-monospace,Consolas,monospace}
  .bubble code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:rgba(127,166,255,.12);padding:1px 5px;border-radius:5px}
  .bubble pre code{background:none;padding:0}
  .msg-acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .mini-btn{font-size:12px;color:var(--acc2);background:rgba(79,124,255,.12);border:1px solid rgba(79,124,255,.35);border-radius:8px;padding:5px 10px;cursor:pointer}
  .mini-btn:hover{background:rgba(79,124,255,.22)}
  .mini-btn.ok{color:var(--ok);border-color:rgba(52,201,142,.4);background:rgba(52,201,142,.1)}
  .mini-btn:disabled{opacity:.5;cursor:default}
  .think{display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-size:13px}
  .think .d{width:6px;height:6px;border-radius:50%;background:var(--acc2);animation:blink 1.2s infinite}
  .think .d:nth-child(2){animation-delay:.2s}.think .d:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .err-box{border-left:3px solid var(--err);background:rgba(255,107,107,.08);padding:9px 12px;border-radius:8px;font-size:13px}

  .hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .hero h2{font-size:15px;margin-bottom:10px}
  .hero ol{margin:8px 0 0 18px;font-size:13px;color:var(--muted);line-height:1.9}
  .hero b{color:var(--text)}
  .hero .go{margin-top:12px}

  footer{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:linear-gradient(transparent,var(--bg) 30%)}
  .composer{display:flex;gap:10px;align-items:flex-end;max-width:760px;margin:0 auto}
  .composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--card);color:var(--text);
    border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.5;max-height:132px;outline:none;font-family:inherit}
  .composer textarea:focus{border-color:var(--acc)}
  .send{width:42px;height:42px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--acc),#7c5cff);color:#fff;font-size:16px;cursor:pointer;flex:none}
  .send:disabled{opacity:.45;cursor:default}
  .hint{text-align:center;font-size:11px;color:var(--dim);margin-top:7px}

  .overlay{position:fixed;inset:0;background:rgba(5,8,14,.68);backdrop-filter:blur(4px);z-index:40;display:none;align-items:center;justify-content:center;padding:18px}
  .overlay.show{display:flex}
  .sheet{background:var(--bg2);border:1px solid var(--line);border-radius:18px;width:100%;max-width:560px;max-height:88dvh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.5)}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);flex:none}
  .sheet-head h3{font-size:15px;flex:1}
  .sheet-body{padding:16px 18px;overflow-y:auto}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 12px;font-size:13.5px;outline:none;font-family:inherit}
  .field input:focus{border-color:var(--acc)}
  .field .tip{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.6}
  .field .tip a{color:var(--acc2)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--muted);margin:4px 0 14px}
  .check input{margin-top:3px;accent-color:var(--acc)}
  .sheet-foot{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
  .btn{border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.pri{background:linear-gradient(135deg,var(--acc),#7c5cff);color:#fff}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
  .btn.danger{background:rgba(255,107,107,.12);color:var(--err);border:1px solid rgba(255,107,107,.35)}
  .btn:disabled{opacity:.5;cursor:default}

  .diff-box{background:#0d1117;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.65}
  .diff-head{padding:9px 13px;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:14px;font-family:inherit;font-size:12px;color:var(--muted)}
  .diff-body{padding:10px 0;max-height:46dvh;overflow:auto}
  .dl{padding:0 13px;white-space:pre}
  .dl.add{background:rgba(52,201,142,.12);color:#9fe8c8}
  .dl.del{background:rgba(255,107,107,.12);color:#ffb3b3}
  .dl.ctx{color:var(--muted)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;
    background:var(--card2);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);display:none;max-width:86vw}
  @media (max-width:640px){
    main{padding:14px 12px 8px}
    .bubble{max-width:88%}
    .overlay{align-items:flex-end;padding:0}
    .sheet{border-radius:20px 20px 0 0;max-height:92dvh;max-width:none}
    .row2{grid-template-columns:1fr}
    header .sub{display:none}
    .chip{max-width:32vw}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">⚡</div>
    <div>
      <div class="ttl">订阅规则助手</div>
      <div class="sub">对话诊断 · 自动修改 · 更新订阅</div>
    </div>
    <div class="spacer"></div>
    <div class="chip" id="chip-model" title="当前模型">未配置</div>
    <button class="icon-btn" id="btn-settings" title="设置">⚙</button>
  </header>

  <main><div class="col" id="chat"></div></main>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="例如：github.com 打不开，帮我加一条走代理的规则"></textarea>
      <button class="send" id="btn-send" title="发送">➤</button>
    </div>
    <div class="hint">AI 修改仅写入 config/rules.yaml，提交前会显示差异供确认</div>
  </footer>
</div>

<div class="overlay" id="ov-settings">
  <div class="sheet">
    <div class="sheet-head"><h3>⚙ 设置</h3><button class="icon-btn" data-close="1">✕</button></div>
    <div class="sheet-body">
      <div class="field">
        <label>AI 接口地址（OpenAI 兼容）</label>
        <input id="s-baseurl" placeholder="https://open.bigmodel.cn/api/paas/v4" />
        <div class="tip">更换提供商时改这里，例如任意兼容 /chat/completions 的网关地址。</div>
      </div>
      <div class="row2">
        <div class="field"><label>模型</label><input id="s-model" placeholder="glm-5.3" /></div>
        <div class="field"><label>API Key</label><input id="s-key" type="password" placeholder="sk-... / 智谱 Key" autocomplete="off" /></div>
      </div>
      <div class="row2">
        <div class="field"><label>GitHub 仓库</label><input id="s-repo" placeholder="cab11918/self-host-rule" /></div>
        <div class="field"><label>分支</label><input id="s-branch" placeholder="main" /></div>
      </div>
      <div class="field">
        <label>GitHub Token</label>
        <input id="s-token" type="password" placeholder="github_pat_... / ghp_..." autocomplete="off" />
        <div class="tip">建议用细粒度 Token（仅本仓库、Contents 读写）：<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">创建入口</a>。本机终端也可执行 <code>gh auth token</code> 获取现有 Token。</div>
      </div>
      <div class="field">
        <label>订阅 CDN 基址</label>
        <input id="s-cdn" placeholder="https://cdn.jsdelivr.net/gh/..." />
        <div class="tip">页面从这里读取配置摘要 context.json，与订阅链接同源。</div>
      </div>
      <label class="check"><input id="s-remember" type="checkbox" checked="checked" />在此浏览器记住设置（公共设备请取消）</label>
    </div>
    <div class="sheet-foot">
      <button class="btn pri" id="s-save">保存</button>
      <button class="btn ghost" id="s-test-ai">测试 AI</button>
      <button class="btn ghost" id="s-test-gh">测试 GitHub</button>
      <button class="btn danger" id="s-clear">清除全部</button>
    </div>
  </div>
</div>

<div class="overlay" id="ov-diff">
  <div class="sheet">
    <div class="sheet-head"><h3>修改预览</h3><button class="icon-btn" data-close="1">✕</button></div>
    <div class="sheet-body" id="diff-body"></div>
    <div class="sheet-foot">
      <button class="btn pri" id="diff-apply">应用并更新订阅</button>
      <button class="btn ghost" data-close="1">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
//<![CDATA[
"use strict";
const $ = s => document.querySelector(s);
const STORE_KEY = "self-host-rule-assistant-v1";
const DEFAULTS = {
  ai_base_url: "https://open.bigmodel.cn/api/paas/v4",
  ai_model: "glm-5.3",
  ai_api_key: "",
  gh_token: "",
  gh_repo: "cab11918/self-host-rule",
  gh_branch: "main",
  cdn_base: "https://cdn.jsdelivr.net/gh/cab11918/evg8ch2qr7msndw3@main",
  remember: true,
};
const FALLBACK_GROUPS = ["🔰 节点选择","♻️ 自动选择","⛔️ 广告拦截","🚫 运营劫持","🌍 国外媒体","🌏 国内媒体","Ⓜ️ 微软服务","📲 电报信息","🍎 苹果服务","🎥 NETFLIX","🎮 Steam","🎯 全球直连","🛑 全球拦截","🐟 漏网之鱼","💡 Gemini + Google","🤖 OpenAI + Claude"];
const state = { messages: [], busy: false, ctx: null, pendingDiff: null };

/* ---------- 设置 ---------- */
function loadSettings(){
  const s = { ...DEFAULTS };
  try {
    const raw = localStorage.getItem(STORE_KEY) || sessionStorage.getItem(STORE_KEY);
    if (raw) Object.assign(s, JSON.parse(raw));
  } catch(e){}
  return s;
}
function persistSettings(s){
  try { localStorage.removeItem(STORE_KEY); sessionStorage.removeItem(STORE_KEY); } catch(e){}
  const store = s.remember ? localStorage : sessionStorage;
  store.setItem(STORE_KEY, JSON.stringify(s));
}
function fillSettingsForm(){
  const s = loadSettings();
  $("#s-baseurl").value = s.ai_base_url; $("#s-model").value = s.ai_model;
  $("#s-key").value = s.ai_api_key; $("#s-repo").value = s.gh_repo;
  $("#s-branch").value = s.gh_branch; $("#s-token").value = s.gh_token;
  $("#s-cdn").value = s.cdn_base; $("#s-remember").checked = !!s.remember;
}
function readSettingsForm(){
  const s = loadSettings();
  s.ai_base_url = $("#s-baseurl").value.trim().replace(/\/+$/,"") || DEFAULTS.ai_base_url;
  s.ai_model = $("#s-model").value.trim() || DEFAULTS.ai_model;
  s.ai_api_key = $("#s-key").value.trim();
  s.gh_repo = $("#s-repo").value.trim() || DEFAULTS.gh_repo;
  s.gh_branch = $("#s-branch").value.trim() || DEFAULTS.gh_branch;
  s.gh_token = $("#s-token").value.trim();
  s.cdn_base = $("#s-cdn").value.trim().replace(/\/+$/,"") || DEFAULTS.cdn_base;
  s.remember = $("#s-remember").checked;
  return s;
}

/* ---------- 工具 ---------- */
function esc(t){ return t.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg, ms=2600){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.display="none", ms); }
function b64encode(str){ const bytes=new TextEncoder().encode(str); let bin=""; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); }
function b64decode(b64){ const bin=atob(b64.replace(/\s/g,"")); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new TextDecoder().decode(arr); }
function extractYaml(text){
  const m = [...text.matchAll(/```(?:yaml|yml)?\s*\n([\s\S]*?)```/g)];
  if (!m.length) return null;
  return m[m.length-1][1].trim();
}
function fmtMd(t){
  let html = esc(t);
  html = html.replace(/```(?:yaml|yml)?\s*\n([\s\S]*?)```/g, (mm, code) => "<pre><code>"+code.replace(/\n$/,"")+"</code></pre>");
  html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  html = html.replace(/\n/g, "<br>");
  return html;
}
function lineDiff(a, b){
  const A=a.split("\n"), B=b.split("\n"), n=A.length, m=B.length;
  const dp=Array.from({length:n+1},()=>new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j] = A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<n && j<m){
    if(A[i]===B[j]){ out.push({t:" ", s:A[i]}); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]){ out.push({t:"-", s:A[i]}); i++; }
    else { out.push({t:"+", s:B[j]}); j++; }
  }
  while(i<n) out.push({t:"-", s:A[i++]});
  while(j<m) out.push({t:"+", s:B[j++]});
  return out;
}

/* ---------- GitHub ---------- */
async function ghApi(path, opts={}){
  const s = loadSettings();
  const r = await fetch("https://api.github.com"+path, {
    ...opts,
    headers: {
      "Authorization": "Bearer "+s.gh_token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(opts.headers||{}),
    },
  });
  if (!r.ok) {
    let msg = r.status+" "+r.statusText;
    try { const j = await r.json(); if (j.message) msg = j.message; } catch(e){}
    throw new Error("GitHub: "+msg);
  }
  return r.json();
}
async function fetchRules(){
  const s = loadSettings();
  const j = await ghApi(`/repos/${s.gh_repo}/contents/config/rules.yaml?ref=${encodeURIComponent(s.gh_branch)}&t=${Date.now()}`);
  return { sha: j.sha, text: b64decode(j.content) };
}
async function commitRules(text, sha, summary){
  const s = loadSettings();
  const j = await ghApi(`/repos/${s.gh_repo}/contents/config/rules.yaml`, {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      message: "ai: "+(summary||"update rules via assistant"),
      content: b64encode(text),
      sha: sha,
      branch: s.gh_branch,
    }),
  });
  return j;
}

/* ---------- AI ---------- */
async function fetchContext(){
  const s = loadSettings();
  try {
    const r = await fetch(s.cdn_base+"/context.json?t="+Date.now(), {cache:"no-store"});
    if (r.ok) return await r.json();
  } catch(e){}
  return { group_names: FALLBACK_GROUPS, proxy_count: null, rule_count: null };
}
async function buildSystemPrompt(rulesText){
  const ctx = state.ctx || (state.ctx = await fetchContext());
  const groups = (ctx.group_names||FALLBACK_GROUPS).join("、");
  const scale = ctx.rule_count ? `上游规则约 ${ctx.rule_count} 条` : "上游规则约一万条";
  return `你是 Clash 订阅规则维护助手，唯一可编辑的文件是仓库中的 config/rules.yaml（自定义规则层，优先生效于${scale}）。

当前 config/rules.yaml 全文：
\`\`\`yaml
${rulesText}
\`\`\`

可用代理组：${groups}
组名映射：🤖 AI 服务 → 🤖 OpenAI + Claude；📺 流媒体 → 🎥 NETFLIX；🎯 全球直连/🛑 全球拦截/🐟 漏网之鱼 等其余同名。

规则语法：类型,值,目标组[,no-resolve]。常用类型 DOMAIN / DOMAIN-SUFFIX / DOMAIN-KEYWORD / IP-CIDR / GEOIP。
结构：lan（内网直连）→ custom（用户自定义，日常只改这里）→ final（GEOIP,CN 与 MATCH 兜底）。

工作方式：
1. 根据用户描述定位问题：通常是缺规则、分流走错组（该直连的走了代理、或该代理的走了直连）。
2. 给出最小修改：只在 custom 段增删改规则，保持其余内容与注释不变；国内域名/公司内网 → 🎯 全球直连，被墙或国外服务 → 🔰 节点选择。
3. 回复格式：先用 1~3 句说明诊断结论；如需修改，再输出修改后的完整 rules.yaml，放在一个 \`\`\`yaml 代码块中。
4. 若问题与规则无关（如节点故障、账号到期、DNS 污染但需改 template），明确说明并给建议，此时不要输出 yaml。`;
}
async function callAI(){
  const s = loadSettings();
  const sys = await buildSystemPrompt(state.currentRules);
  const history = state.messages.slice(-12).map(m => ({role: m.role, content: m.content}));
  const r = await fetch(s.ai_base_url+"/chat/completions", {
    method: "POST",
    headers: { "Authorization": "Bearer "+s.ai_api_key, "Content-Type": "application/json" },
    body: JSON.stringify({ model: s.ai_model, messages: [{role:"system",content:sys}, ...history], temperature: 0.2 }),
  });
  if (!r.ok) {
    let msg = r.status+" "+r.statusText;
    try { const j = await r.json(); if (j.error && j.error.message) msg = j.error.message; else if (j.message) msg = j.message; } catch(e){}
    throw new Error("AI 接口: "+msg);
  }
  const j = await r.json();
  const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
  if (!c) throw new Error("AI 返回了空内容");
  return c;
}

/* ---------- 界面 ---------- */
function addMsg(role, html){
  const col = $("#chat");
  const div = document.createElement("div");
  div.className = "msg "+role;
  div.innerHTML = `<div class="ava">${role==="user"?"🧑":"🤖"}</div><div class="bubble">${html}</div>`;
  col.appendChild(div);
  $("main").scrollTop = $("main").scrollHeight;
  return div.querySelector(".bubble");
}
function addHero(){
  const s = loadSettings();
  if (s.ai_api_key && s.gh_token) return;
  const col = $("#chat");
  const div = document.createElement("div");
  div.className = "hero";
  div.innerHTML = `<h2>👋 开始之前</h2>
    <ol>
      <li>点右上角 <b>⚙</b> 打开设置，填入 <b>AI Key</b>（智谱默认已适配 glm-5.3）</li>
      <li>填入 <b>GitHub Token</b>（用于提交规则修改，仅存本浏览器）</li>
      <li>直接对话，例如「github.com 打不开」或「公司内网 weoa.com 走直连」</li>
    </ol>
    <div class="go"><button class="btn pri" id="hero-open">打开设置</button></div>`;
  col.appendChild(div);
  $("#hero-open").onclick = () => openOverlay("#ov-settings");
}
function refreshChips(){
  const s = loadSettings();
  $("#chip-model").textContent = s.ai_api_key ? s.ai_model : "未配置";
}
function openOverlay(sel){ $(sel).classList.add("show"); }
function closeOverlays(){ document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("show")); }

async function send(){
  if (state.busy) return;
  const s = loadSettings();
  const text = $("#input").value.trim();
  if (!text) return;
  if (!s.ai_api_key || !s.gh_token){ openOverlay("#ov-settings"); toast("请先在设置中填写 AI Key 和 GitHub Token"); return; }
  state.busy = true; $("#btn-send").disabled = true; $("#input").value="";
  autosize();
  addMsg("user", fmtMd(text));
  state.messages.push({role:"user", content:text});

  const think = addMsg("ai", `<span class="think"><span class="d"></span><span class="d"></span><span class="d"></span> 读取当前配置并思考中… <span id="elapsed">0s</span></span>`);
  const t0 = Date.now();
  const tm = setInterval(()=>{ const e=$("#elapsed"); if(e) e.textContent=Math.round((Date.now()-t0)/1000)+"s"; }, 1000);
  try {
    const rules = await fetchRules();
    state.currentRules = rules.text;
    const reply = await callAI();
    state.messages.push({role:"assistant", content:reply});
    think.innerHTML = fmtMd(reply);
    const yaml = extractYaml(reply);
    if (yaml){
      const acts = document.createElement("div");
      acts.className = "msg-acts";
      acts.innerHTML = `<button class="mini-btn">📄 查看修改方案</button>`;
      think.appendChild(acts);
      acts.querySelector("button").onclick = () => showDiff(yaml);
    }
  } catch(e){
    think.innerHTML = `<div class="err-box">${esc(e.message)}</div>` +
      (e.message.includes("Failed to fetch") ? `<div class="tip" style="margin-top:6px;font-size:12px;color:var(--muted)">提示：若 AI 接口报网络错误，多为当前网络无法直连该地址；GitHub 报错则检查代理或 Token 权限。</div>` : "");
  } finally {
    clearInterval(tm);
    state.busy = false; $("#btn-send").disabled = false;
    $("main").scrollTop = $("main").scrollHeight;
  }
}
function showDiff(yaml){
  const cur = state.currentRules;
  const diff = lineDiff(cur, yaml);
  const add = diff.filter(d=>d.t==="+").length, del = diff.filter(d=>d.t==="-").length;
  $("#diff-body").innerHTML = `
    <div class="diff-box">
      <div class="diff-head"><span>config/rules.yaml</span><span style="color:var(--ok)">+${add}</span><span style="color:var(--err)">-${del}</span></div>
      <div class="diff-body">${diff.map(d=>`<div class="dl ${d.t==="+"?"add":d.t==="-"?"del":"ctx"}">${d.t===" "?" ":d.t+" "}${esc(d.s)}</div>`).join("")}</div>
    </div>
    <div class="field" style="margin-top:12px"><label>提交说明</label><input id="diff-msg" placeholder="ai: 修复分流规则" /></div>`;
  state.pendingDiff = yaml;
  openOverlay("#ov-diff");
}
async function applyDiff(){
  const yaml = state.pendingDiff;
  if (!yaml) return;
  const btn = $("#diff-apply");
  btn.disabled = true; btn.textContent = "提交中…";
  try {
    const rules = await fetchRules();
    const summary = ($("#diff-msg").value.trim() || "update rules via assistant").slice(0,72);
    const j = await commitRules(yaml, rules.sha, summary);
    closeOverlays();
    const bubble = addMsg("ai", `✅ 已提交：<b>${esc(summary)}</b><br>
      流水线约 30 秒内自动重建并发布；订阅链接因 CDN 缓存，通常几分钟内更新（最长约 12 小时）。<br>
      <a href="${j.commit && j.commit.html_url || "#"}" target="_blank" rel="noopener" style="color:var(--acc2)">查看提交</a>`);
    toast("已提交，订阅将自动更新");
  } catch(e){
    toast("提交失败："+e.message, 5000);
  } finally {
    btn.disabled = false; btn.textContent = "应用并更新订阅";
  }
}

/* ---------- 事件 ---------- */
function autosize(){ const t=$("#input"); t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,132)+"px"; }
$("#input").addEventListener("input", autosize);
$("#input").addEventListener("keydown", e => {
  if (e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});
$("#btn-send").onclick = send;
$("#btn-settings").onclick = () => { fillSettingsForm(); openOverlay("#ov-settings"); };
document.querySelectorAll("[data-close]").forEach(b => b.onclick = closeOverlays);
document.querySelectorAll(".overlay").forEach(o => o.addEventListener("click", e => { if (e.target===o) closeOverlays(); }));
$("#s-save").onclick = () => {
  const s = readSettingsForm();
  if (!s.ai_api_key || !s.gh_token){ toast("已保存（部分字段为空）"); } else { toast("设置已保存"); }
  persistSettings(s); refreshChips(); closeOverlays(); addHero();
};
$("#s-clear").onclick = () => {
  localStorage.removeItem(STORE_KEY); sessionStorage.removeItem(STORE_KEY);
  fillSettingsForm(); refreshChips(); toast("已清除本浏览器保存的设置");
};
$("#s-test-ai").onclick = async () => {
  const s = readSettingsForm(); persistSettings(s);
  if (!s.ai_api_key) return toast("请先填写 API Key");
  const btn = $("#s-test-ai"); btn.disabled = true; btn.textContent = "测试中…";
  try {
    const r = await fetch(s.ai_base_url+"/chat/completions", {
      method:"POST",
      headers:{ "Authorization":"Bearer "+s.ai_api_key, "Content-Type":"application/json" },
      body: JSON.stringify({ model:s.ai_model, messages:[{role:"user",content:"回复：ok"}], max_tokens: 8 }),
    });
    const j = await r.json().catch(()=>({}));
    if (r.ok) toast("AI 连接成功 ✓");
    else toast("AI 返回 "+r.status+"："+((j.error&&j.error.message)||j.message||r.statusText), 5000);
  } catch(e){ toast("AI 网络错误："+e.message, 5000); }
  finally { btn.disabled=false; btn.textContent="测试 AI"; }
};
$("#s-test-gh").onclick = async () => {
  const s = readSettingsForm(); persistSettings(s);
  if (!s.gh_token) return toast("请先填写 GitHub Token");
  const btn = $("#s-test-gh"); btn.disabled=true; btn.textContent="测试中…";
  try {
    const j = await ghApi(`/repos/${s.gh_repo}`);
    toast(j.full_name+" 可访问（"+j.visibility+"）✓");
  } catch(e){ toast(e.message, 5000); }
  finally { btn.disabled=false; btn.textContent="测试 GitHub"; }
};
$("#diff-apply").onclick = applyDiff;

refreshChips();
addHero();
autosize();
//]]>
</script>
</body>
</html>
